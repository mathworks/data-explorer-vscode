# Continuous integration: typecheck, build (desktop + web), package the .vsix, unit
# tests, and the VS Code integration suite. Runs on every push to main and on pull
# requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Checking out is the only thing the token is for here: this workflow writes
# nothing back — no comment, no commit, no release. Spelled out rather than left
# to the repository default, which a settings change could widen without anyone
# touching a workflow file. Mirrors release.yml, which asks for `contents: write`
# because it genuinely uploads a Release asset.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      # No later step uses git with the token, so checkout does not keep it.
      # This also proves, on every PR, the npm ci that release.yml runs the same way.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # Before `npm ci`, deliberately: the check needs no dependencies, and a leak
      # should be reported in seconds rather than behind a five-minute build. It is
      # also the one check whose failure cannot be fixed by retrying.
      - name: Leak check
        run: npm run check:leak

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (desktop + web)
        run: |
          npm run build
          npm run build:web

      # Packages the .vsix the way release.yml does, so a packager or Node change that
      # breaks packaging fails a PR rather than a release tag. The file is thrown away
      # (`*.vsix` is gitignored); test/workflowNode.test.ts checks that this step is here.
      - name: Package VSIX
        run: npx vsce package --out ci-check.vsix

      - name: Unit tests
        run: npm test

      # NOT FOR MERGE (a CI run for #171 only): the originals the JSON gesture sweep's case
      # list names, at the paths it names them by. data-explorer-core's own fixtures at
      # v1.52.0, and this repository's test/fixtures/arch.sldd.
      - name: Inputs of the JSON gesture sweep
        run: |
          git clone --quiet --depth 1 --branch v1.52.0 https://github.com/mathworks/data-explorer-core.git /tmp/dexview/core-v152
          mkdir -p /tmp/dexview/refs-sldd/fixtures
          cp test/fixtures/arch.sldd /tmp/dexview/refs-sldd/fixtures/

      # The integration suite launches a real VS Code instance, which needs a
      # display on Linux — run it under a virtual framebuffer.
      - name: Integration tests
        run: xvfb-run -a npm run test:integration
        # NOT FOR MERGE (#171): the JSON gesture sweep (editorGestureSweep.test.ts), each
        # gesture saved, then undone and redone through VS Code's own Undo and Redo, which
        # this window can reach.
        env:
          EB_P4_GESTURE: ${{ github.workspace }}/test-integration/p4/select-json-gesture.jsonl
          EB_P4_GESTURE_OUT: /tmp/eb-run-ci

      # NOT FOR MERGE (#171): the sweep's saves and its log, to compare with earlier runs.
      - name: The JSON gesture sweep's saves
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-gesture-sweep
          path: /tmp/eb-run-ci
          if-no-files-found: error
