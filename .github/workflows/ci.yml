# Continuous integration: typecheck, build (desktop + web), unit tests, and the
# VS Code integration suite. Runs on every push to main and on pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # Before `npm ci`, deliberately: the check needs no dependencies, and a leak
      # should be reported in seconds rather than behind a five-minute build. It is
      # also the one check whose failure cannot be fixed by retrying.
      - name: Leak check
        run: npm run check:leak

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (desktop + web)
        run: |
          npm run build
          npm run build:web

      - name: Unit tests
        run: npm test

      # The integration suite launches a real VS Code instance, which needs a
      # display on Linux — run it under a virtual framebuffer.
      - name: Integration tests
        run: xvfb-run -a npm run test:integration
