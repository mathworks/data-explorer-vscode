# Tag-based release: build the extension, package the .vsix, and publish a
# GitHub Release with the .vsix attached as a downloadable asset.
#
# Push an annotated tag matching `v*` (e.g. `v1.0.1`) to trigger this. The
# packaged version comes from the tag (v1.0.1 -> 1.0.1) and must match the
# version in package.json.
#
# An odd minor version (1.47.x) is a Marketplace pre-release and an even one
# (1.48.x) a stable release, the way VS Code numbers its own: for an odd minor
# the .vsix is packaged with --pre-release and the GitHub Release is marked as
# a pre-release too.
#
# Marketplace publishing is intentionally manual (download the Release .vsix
# and run `npx vsce publish --packagePath <vsix>`, or for an odd minor
# `npx vsce publish --pre-release --packagePath <vsix>`); this workflow only
# builds and publishes the GitHub Release.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the Release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # This job's token can write (it creates the Release), so checkout does
      # not leave it on disk for npm ci's install scripts and the build to read.
      # The release action below is handed the token as an input instead.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (desktop + web)
        run: |
          npm run build
          npm run build:web

      # Package the version already declared in package.json (no bump). Fail
      # early if the pushed tag doesn't match it, so releases stay consistent.
      # An odd minor is packaged as a pre-release; the `prerelease` output
      # marks the GitHub Release to match.
      - name: Package VSIX
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME (=$VERSION) does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi
          MINOR="$(echo "$VERSION" | cut -d. -f2)"
          if [ $((MINOR % 2)) -eq 1 ]; then
            npx vsce package --pre-release --out "simulink-data-explorer-${VERSION}.vsix"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            npx vsce package --out "simulink-data-explorer-${VERSION}.vsix"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Attach a checksum so a download can be checked with
      # `sha256sum -c SHA256SUMS`. This catches a corrupted or truncated
      # download; it is not a signature and proves nothing about who built the
      # .vsix (that would need build provenance attestation).
      - name: Checksum VSIX
        run: |
          sha256sum simulink-data-explorer-*.vsix | tee SHA256SUMS

      - name: Create GitHub Release
        # A third-party action that holds the write token, pinned to the commit
        # its v3.0.3 tag points at, so a moved tag cannot change what runs here.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            simulink-data-explorer-*.vsix
            SHA256SUMS
          generate_release_notes: true
          prerelease: ${{ steps.package.outputs.prerelease }}

      # Publishing to the VS Code Marketplace is done manually: download the
      # .vsix attached to the GitHub Release (or build it locally with
      # `npm run package`) and run `npx vsce publish --packagePath <vsix>`.
      # For an odd minor, a pre-release, run
      # `npx vsce publish --pre-release --packagePath <vsix>` instead.
