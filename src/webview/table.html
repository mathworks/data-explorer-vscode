<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><title>Data Explorer</title></head>
  <body>
    <div id="dex-error" role="alert" style="display:none;color:var(--vscode-errorForeground,#f14c4c);padding:8px;font-family:var(--vscode-font-family,sans-serif);"></div>
    <!-- Content only. Every overlay (context menu, error dialog, Variable Editor)
         is created by table-main.ts, so this dev shell and the three host-built
         shells stay interchangeable. The banner strip is the exception: it is
         layout, not an overlay, so it has to be declared here too — a hand copy of
         BANNERS_HTML in src/host/webviewHtml.ts, which this static file cannot
         interpolate. test/webviewOverlays.test.ts scans all four shells for the
         same ids so the copy cannot drift. -->
    <div id="dex-banners" style="position:absolute;top:0;left:0;right:0;z-index:2;max-height:40%;overflow:auto;font-family:var(--vscode-font-family,sans-serif);font-size:12px;">
      <div id="dex-notice" role="status" style="display:none;box-sizing:border-box;padding:6px 10px;color:var(--vscode-inputValidation-infoForeground,var(--vscode-foreground));background:var(--vscode-inputValidation-infoBackground,rgba(100,148,237,0.12));border-bottom:1px solid var(--vscode-inputValidation-infoBorder,#4084d0);"></div>
      <div id="dex-warning" role="status" style="display:none;box-sizing:border-box;padding:6px 10px;color:var(--vscode-inputValidation-warningForeground,var(--vscode-foreground));background:var(--vscode-inputValidation-warningBackground,rgba(255,190,60,0.12));border-bottom:1px solid var(--vscode-inputValidation-warningBorder,#b89500);">
        <div id="dex-warning-headline" style="font-weight:600;"></div>
        <ul id="dex-warning-details" style="margin:4px 0 0;padding-inline-start:18px;"></ul>
      </div>
    </div>
    <dex-tree-table style="position:absolute;inset:0;"></dex-tree-table>
    <script type="module" src="/src/webview/table-main.ts"></script>
  </body>
</html>
